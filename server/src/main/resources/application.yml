server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${serve.datasource.driver-class-name}
    url: ${serve.datasource.url}
    username: ${serve.datasource.username}
    password: ${serve.datasource.password}
    type: ${serve.datasource.type}
    druid:
      initial-size: ${serve.datasource.druid.initial-size}
      min-idle: ${serve.datasource.druid.min-idle}
      max-active: ${serve.datasource.druid.max-active}
      max-wait: ${serve.datasource.druid.max-wait}
      time-between-eviction-runs-millis: ${serve.datasource.druid.time-between-eviction-runs-millis}
      min-evictable-idle-time-millis: ${serve.datasource.druid.min-evictable-idle-time-millis}
      validation-query: ${serve.datasource.druid.validation-query}
      test-while-idle: ${serve.datasource.druid.test-while-idle}
      test-on-borrow: ${serve.datasource.druid.test-on-borrow}
      test-on-return: ${serve.datasource.druid.test-on-return}
  # 邮件配置（QQ邮箱）
  mail:
        host: ${serve.mail.host}
        port: ${serve.mail.port}
        username: ${serve.mail.username}
        password: ${serve.mail.password}
        protocol: ${serve.mail.protocol}
        properties:
          mail:
            smtp:
              auth: ${serve.mail.properties.mail.smtp.auth}
              starttls:
                enable: ${serve.mail.properties.mail.smtp.starttls.enable}
                required: ${serve.mail.properties.mail.smtp.starttls.required}
              ssl:
                trust: ${serve.mail.properties.mail.smtp.ssl.trust}

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lin.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

